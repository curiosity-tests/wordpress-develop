# racecar fork-testbed patch. Changes from upstream:
#   1. a `leg` workflow_call input, forwarded by the calling workflow. Neither
#      env nor inputs cross a workflow_call boundary, so this workflow has to
#      recompute CHALK_ON from its own input.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action; `chalk:` is the only variable separating the arms.
#   3. permissions: id-token: write for the action's OIDC connect (the block
#      zeroes unlisted scopes, so everything upstream relied on is restated).
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      leaving fail-fast on cancels instrumented siblings more often than
#      baseline ones and biases the comparison.
#   6. the concurrency group carries the leg. Both arms run on the same ref, so
#      upstream's github.ref-keyed group put them in one group and the second
#      dispatch cancelled the first. Also cancellation-only, never a build change.
# Build and test COMMANDS are unchanged from upstream.
##
# A reusable workflow that downloads and verifies the Gutenberg build once per
# calling workflow run.
##
name: Prepare Gutenberg build

on:
  workflow_call:
    inputs:
      leg:
        description: "baseline or instrumented, forwarded by the calling workflow"
        type: string
        required: false
        default: ""
      profile:
        description: "CrashOverride chalk profile"
        type: string
        required: false
        default: curiosity-tests-racecar
      repository:
        description: 'The repository to check out. Defaults to the repository calling this workflow.'
        required: false
        type: 'string'
        default: ''
      # Names the uploaded build too, so it must also be a valid artifact name: no slashes,
      # and none of : < > | * ? " — a `refs/heads/trunk` or `feature/x` value fails the upload.
      ref:
        description: 'The branch, tag, or SHA to check out. Defaults to the commit that started the calling workflow run.'
        required: false
        type: 'string'
        default: ''
    outputs:
      gutenberg-sha:
        description: 'The immutable Gutenberg source SHA verified by this workflow.'
        value: ${{ jobs.prepare-gutenberg.outputs.gutenberg-sha }}

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions:
  contents: read
  id-token: write

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  prepare-gutenberg:
    name: Gutenberg
    runs-on: ubuntu-24.04
    # Two download attempts of up to six minutes each, where download.js retries internally.
    timeout-minutes: 15
    outputs:
      gutenberg-sha: ${{ steps.download.outputs.gutenberg-sha }}
    permissions:
      contents: read
      id-token: write

    steps:
      # `ref` otherwise falls back to this run's commit, which another repository does not have.
    - name: Require a ref when preparing another repository
      if: ${{ inputs.repository != '' && inputs.ref == '' }}
      run: |
        echo 'Preparing another repository needs an explicit ref.' >&2
        exit 1

      # The upload names the artifact after `ref` and is this job's last step, so an unusable
      # value would otherwise fail only once the whole download and verify has already run.
    - name: Require a ref the artifact name accepts
      if: ${{ inputs.ref != '' }}
      env:
        REF: ${{ inputs.ref }}
      run: |
        invalid='[/:<>|*?"\]'
        if [[ "$REF" =~ $invalid ]]; then
          echo "A ref that names an artifact cannot contain / : < > | * ? \" \\ - received: $REF" >&2
          exit 1
        fi

    - name: Checkout repository
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        repository: ${{ inputs.repository || github.repository }}
          # Resolve the Gutenberg ref from the exact commit that started this workflow run,
          # unless the caller is preparing a build for a repository or branch of its own.
        ref: ${{ inputs.ref || github.sha }}
        show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e   # v6.4.0
      with:
        node-version-file: '.nvmrc'

    - name: Download and verify Gutenberg build
      id: download
      run: |
        # Branches whose download.js predates the in-script retry stream the blob straight
        # into tar in a single attempt, so an interrupted stream fails the run outright.
        # One retry, not two: where download.js does retry, it already allows three tries of
        # two minutes each, and a third attempt here would outrun `timeout-minutes` and have
        # the job killed rather than reported.
        if ! node tools/gutenberg/download.js; then
          echo 'Gutenberg download failed; retrying in 5 seconds...'
          sleep 5
          node tools/gutenberg/download.js
        fi

        gutenberg_sha="$(tr -d '\n' < gutenberg/.gutenberg-hash)"
        if [[ ! "$gutenberg_sha" =~ ^[a-fA-F0-9]{40}$ ]]; then
          echo "Expected a 40-character Gutenberg SHA, received: $gutenberg_sha" >&2
          exit 1
        fi
        echo "gutenberg-sha=$gutenberg_sha" >> "$GITHUB_OUTPUT"

    - name: Upload Gutenberg build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
          # Every branch in a run shares one artifact namespace, so name the build after the
          # ref it came from. The PHPUnit consumer composes the same name from its own `ref`,
          # so the name is never passed between them.
        name: gutenberg-build${{ inputs.ref && format( '-{0}', inputs.ref ) || '' }}
        path: gutenberg/
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 1
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
